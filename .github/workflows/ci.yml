name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验 SKILL.md frontmatter
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---\n"), "SKILL.md 必须以 YAML frontmatter 开头"
          fm = text.split("---", 2)[1]
          for key in ("name:", "description:"):
              assert key in fm, f"frontmatter 缺少 {key}"
          print("frontmatter OK")
          PY

      - name: 校验示例通过合规检查
        run: python scripts/check_banned_words.py examples/*.md

      - name: 校验脚本语法
        run: python -m py_compile scripts/check_banned_words.py
